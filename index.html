<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donasi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f4ef;
      color: #262626;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .emoji { font-size: 56px; line-height: 1; }

    h1 {
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    p.sub {
      font-size: clamp(16px, 4.5vw, 19px);
      color: #57534e;
      line-height: 1.5;
    }

    a.btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 18px 24px;
      background: #ef4444;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 4px 0 #b91c1c;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    a.btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b91c1c;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #a8a29e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">🙏</div>
    <h1>Terima kasih mau donate.</h1>
    <p class="sub">Tapi simpan uangmu. Mending subscribe aja.</p>
    <a class="btn" href="%%LINK_CHANNEL%%">Oke, subscribe</a>
    <footer>Halaman ini dibuat pakai AI dalam 1 prompt, sama kayak aplikasinya.</footer>
  </main>
</body>
</html>
